<div class="app-container">
  <app-navbar #navbar></app-navbar>
  <div class="content-wrapper">
    <header>
      <button class="hamburger-header" (click)="navbar.toggleSidebar()" title="Alternar menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h2>{{ title }}</h2>

      <div class="header-actions">
        <!-- Notificaciones -->
        <div class="notifications-wrapper">
          <button class="header-icon-btn" (click)="toggleNotifications()" title="Notificaciones">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
            </svg>
            <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
          </button>

          <!-- Dropdown de notificaciones -->
          <div class="notifications-dropdown" *ngIf="showNotificationsDropdown">
            <div class="dropdown-header">
              <h4>Notificaciones</h4>
              <span class="unread-count" *ngIf="unreadCount > 0">{{ unreadCount }} sin leer</span>
            </div>

            <div class="dropdown-list">
              <div
                class="dropdown-item"
                *ngFor="let notification of displayedNotifications"
                [class.unread]="!notification.read"
                (click)="markAsRead(notification)">
                <div class="item-icon" [class]="'type-' + notification.type">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path [attr.d]="getTypeIcon(notification.type)"/>
                  </svg>
                </div>
                <div class="item-content">
                  <strong>{{ notification.title }}</strong>
                  <p>{{ notification.message }}</p>
                </div>
              </div>
            </div>

            <a class="dropdown-footer" routerLink="/notifications" (click)="closeNotifications()">
              Ver todas las notificaciones
            </a>
          </div>
        </div>

        <!-- Perfil -->
        <a class="header-icon-btn" routerLink="/profile" title="Mi perfil">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
          </svg>
        </a>
      </div>
    </header>
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Overlay para cerrar dropdown -->
<div class="dropdown-overlay" *ngIf="showNotificationsDropdown" (click)="closeNotifications()"></div>
