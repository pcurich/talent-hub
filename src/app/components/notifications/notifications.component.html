<div class="notifications-container">
  <div class="notifications-header">
    <div class="header-title">
      <h2>Notificaciones</h2>
      <span class="unread-badge" *ngIf="getUnreadCount() > 0">{{ getUnreadCount() }} sin leer</span>
    </div>
    <button class="btn-mark-all" (click)="markAllAsRead()" *ngIf="getUnreadCount() > 0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
        <path d="M18 7l-1.41-1.41-6.34 6.34 1.41 1.41L18 7zm4.24-1.41L11.66 16.17 7.48 12l-1.41 1.41L11.66 19l12-12-1.42-1.41zM.41 13.41L6 19l1.41-1.41L1.83 12 .41 13.41z"/>
      </svg>
      Marcar todo como leído
    </button>
  </div>

  <div class="filter-tabs">
    <button 
      [class.active]="selectedFilter === 'all'" 
      (click)="setFilter('all')">
      Todas
    </button>
    <button 
      [class.active]="selectedFilter === 'unread'" 
      (click)="setFilter('unread')">
      Sin leer
    </button>
    <button 
      [class.active]="selectedFilter === 'read'" 
      (click)="setFilter('read')">
      Leídas
    </button>
  </div>

  <div class="notifications-list">
    <div 
      class="notification-item" 
      *ngFor="let notification of filteredNotifications"
      [class.unread]="!notification.read"
      [class]="'type-' + notification.type"
      (click)="markAsRead(notification)">
      
      <div class="notification-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path [attr.d]="getTypeIcon(notification.type)"/>
        </svg>
      </div>
      
      <div class="notification-content">
        <div class="notification-header">
          <h4>{{ notification.title }}</h4>
          <span class="notification-time">{{ notification.createdAt | date:'short' }}</span>
        </div>
        <p>{{ notification.message }}</p>
      </div>

      <div class="unread-indicator" *ngIf="!notification.read"></div>
    </div>

    <div class="empty-state" *ngIf="filteredNotifications.length === 0">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
        <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
      </svg>
      <p>No hay notificaciones</p>
    </div>
  </div>
</div>
