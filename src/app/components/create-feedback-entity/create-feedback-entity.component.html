<div class="create-container">
  <div class="form-header">
    <h2>Crear Nuevo Feedback</h2>
    <button class="btn-cancel" (click)="cancel()">✕ Cancelar</button>
  </div>

  <form (ngSubmit)="onSubmit()" #feedbackForm="ngForm">
    <!-- Información del Contexto (Solo lectura) -->
    <section class="form-section">
      <h3>Información del Contexto</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Squad</label>
          <input type="text" [value]="entity.squad.name" disabled readonly />
        </div>

        <div class="form-group">
          <label>Product Owner</label>
          <input type="text" [value]="entity.squad.productOwner.name" disabled readonly />
        </div>

        <div class="form-group">
          <label>Team Member</label>
          <input type="text" [value]="entity.teamMember.name" disabled readonly />
        </div>

        <div class="form-group">
          <label>Registro</label>
          <input type="text" [value]="entity.teamMember.registration" disabled readonly />
        </div>

        <div class="form-group">
          <label>Fecha POCLAC</label>
          <input type="text" [value]="entity.poclacDate | date:'dd/MM/yyyy'" disabled readonly />
        </div>
      </div>
    </section>

    <!-- Información del Feedback -->
    <section class="form-section">
      <h3>Información del Feedback</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="seniority">Seniority</label>
          <select id="seniority" name="seniority" [(ngModel)]="entity.seniority" [compareWith]="compareFieldOption">
            <option *ngFor="let option of seniorityOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="feedbackProvider">Proveedor de Feedback <span class="required">*</span></label>
          <select id="feedbackProvider" name="feedbackProvider" [(ngModel)]="entity.feedbackProvider" [compareWith]="compareFieldOption" required>
            <option *ngFor="let option of feedbackProviderOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="feedbackType">Tipo de Feedback <span class="required">*</span></label>
          <select id="feedbackType" name="feedbackType" [(ngModel)]="entity.feedbackType" [compareWith]="compareFieldOption" required>
            <option *ngFor="let option of feedbackTypeOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Calificación General -->
    <section class="form-section">
      <h3>Calificación General</h3>
      <div class="form-group">
        <label for="generalRating">Calificación</label>
        <select id="generalRating" name="generalRating" [(ngModel)]="entity.generalRating" [compareWith]="compareFieldOption">
          <option *ngFor="let option of generalRatingOptions" [ngValue]="option">{{ option.label }}</option>
        </select>
      </div>
    </section>

    <!-- Desempeño -->
    <section class="form-section">
      <h3>Evaluación de Desempeño</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="performanceWhat">¿Cumple con la entrega del backlog?</label>
          <select id="performanceWhat" name="performanceWhat" [(ngModel)]="entity.performance.what" [compareWith]="compareFieldOption">
            <option *ngFor="let option of performanceWhatOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="performanceHow">¿Vive los principios Samay?</label>
          <select id="performanceHow" name="performanceHow" [(ngModel)]="entity.performance.how" [compareWith]="compareFieldOption">
            <option *ngFor="let option of performanceHowOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>

        <div class="form-group">
          <label for="performanceAchievements">Logros y resultados</label>
          <select id="performanceAchievements" name="performanceAchievements" [(ngModel)]="entity.performance.achievements" [compareWith]="compareFieldOption">
            <option *ngFor="let option of performanceAchievementsOptions" [ngValue]="option">{{ option.label }}</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label for="performanceDetails">Detalles de desempeño</label>
          <textarea
            id="performanceDetails"
            name="performanceDetails"
            [(ngModel)]="entity.performance.details"
            rows="3"
            placeholder="Detalles adicionales del desempeño"
          ></textarea>
        </div>
      </div>
    </section>

    <!-- Feedback SBI -->
    <section class="form-section">
      <h3>Feedback - Método SBI</h3>

      <div class="form-group">
        <label for="situation">Situación</label>
        <textarea
          id="situation"
          name="situation"
          [(ngModel)]="entity.feedbackDetails.situation"
          rows="3"
          placeholder="Describa la situación específica"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="behavior">Comportamiento</label>
        <textarea
          id="behavior"
          name="behavior"
          [(ngModel)]="entity.feedbackDetails.behavior"
          rows="3"
          placeholder="Describa el comportamiento observado"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="impact">Impacto</label>
        <textarea
          id="impact"
          name="impact"
          [(ngModel)]="entity.feedbackDetails.impact"
          rows="3"
          placeholder="Describa el impacto del comportamiento"
        ></textarea>
      </div>
    </section>

    <!-- Expectativas -->
    <section class="form-section">
      <h3>Expectativas del Usuario</h3>
      <div class="form-group">
        <label for="userExpectations">Expectativas</label>
        <textarea
          id="userExpectations"
          name="userExpectations"
          [(ngModel)]="entity.userExpectations"
          rows="3"
          placeholder="Describa las expectativas"
        ></textarea>
      </div>
    </section>

    <!-- Plan de Acción -->
    <section class="form-section">
      <div class="section-header">
        <h3>Plan de Acción</h3>
        <button type="button" class="btn-add" (click)="addActionPlan()">+ Agregar Acción</button>
      </div>

      <div class="action-plans">
        <div *ngFor="let action of entity.actionPlan; let i = index; trackBy: trackByIndex" class="action-plan-card">
          <div class="card-header">
            <h4>Acción {{ i + 1 }}</h4>
            <button type="button" class="btn-remove" (click)="removeActionPlan(i)">✕</button>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label [for]="'actionable-' + i">Accionable</label>
              <input type="text" [id]="'actionable-' + i" [name]="'actionable-' + i" [(ngModel)]="action.actionable">
            </div>

            <div class="form-group">
              <label [for]="'responsible-' + i">Responsable</label>
              <select [id]="'responsible-' + i" [name]="'responsible-' + i" [(ngModel)]="action.responsible" [compareWith]="compareFieldOption">
                <option *ngFor="let option of actionResponsibleOptions" [ngValue]="option">{{ option.label }}</option>
              </select>
            </div>

            <div class="form-group">
              <label [for]="'commitmentDate-' + i">Fecha de Compromiso</label>
              <input type="date" [id]="'commitmentDate-' + i" [name]="'commitmentDate-' + i" [(ngModel)]="action.commitmentDate">
            </div>

            <div class="form-group">
              <label [for]="'status-' + i">Estado</label>
              <select [id]="'status-' + i" [name]="'status-' + i" [(ngModel)]="action.status" [compareWith]="compareFieldOption">
                <option *ngFor="let option of actionStatusOptions" [ngValue]="option">{{ option.label }}</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label [for]="'details-' + i">Detalles</label>
              <textarea [id]="'details-' + i" [name]="'details-' + i" [(ngModel)]="action.details" rows="2"></textarea>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Botones de acción -->
    <div class="form-actions">
      <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="!feedbackForm.form.valid">Crear Feedback</button>
    </div>
  </form>
</div>
