<div class="login-shell">
  <div class="login-card">
    <div class="login-header">
      <h1>Acceso al Sistema</h1>
      <p>Ingresa tu matrícula y correo para iniciar</p>
    </div>

    <form class="login-form" #loginForm="ngForm" (ngSubmit)="save()">
      <div class="form-group">
        <label for="registration">Matrícula</label>
        <input
          id="registration"
          type="text"
          name="registration"
          [(ngModel)]="registration"
          placeholder="Ej: T10541"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="usuario@empresa.com"
          required
        >
      </div>

      <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-primary" [disabled]="!registration || !email || loginForm.invalid">
        Entrar
      </button>
    </form>
  </div>
</div>
